<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#070b1f" />
  <title>Word Galaxy</title>

  <!-- Fonts (graceful fallbacks keep it readable offline / in an APK) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- animated starfield backdrop -->
  <div class="space-bg" aria-hidden="true">
    <div class="stars stars--far"></div>
    <div class="stars stars--mid"></div>
    <div class="stars stars--near"></div>
    <div class="nebula nebula--1"></div>
    <div class="nebula nebula--2"></div>
  </div>

  <!-- the game mounts here -->
  <main id="app" class="app-shell"></main>

  <!-- scripts: data -> systems -> engine -> screens -> bootstrap ------ -->
  <script src="data/galaxies.js"></script>

  <script src="game/SaveManager.js"></script>
  <script src="game/HintSystem.js"></script>
  <script src="game/ShuffleSystem.js"></script>
  <script src="game/GameEngine.js"></script>

  <script src="screens/MainMenu.js"></script>
  <script src="screens/GalaxyMap.js"></script>
  <script src="screens/PuzzleScreen.js"></script>
  <script src="screens/RevealScreen.js"></script>

  <script src="app.js"></script>
</body>
</html>
